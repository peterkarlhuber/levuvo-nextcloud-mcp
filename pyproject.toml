[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "levuvo-nextcloud-mcp"
version = "0.4.0"
description = "Read-only Nextcloud WebDAV MCP server for Levuvo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "PyJWT[crypto]>=2.9,<3.0",
    "uvicorn>=0.30,<1.0",
    "defusedxml>=0.7.1,<1.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
levuvo-nextcloud-mcp = "levuvo_nextcloud_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/levuvo_nextcloud_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
